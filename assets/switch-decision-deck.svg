<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sustainability Knowledge Check</title>
  <desc id="desc">Premium evidence-review experience for sustainability decisions in an Airbus Defence and Space context.</desc>
  <defs>
    <linearGradient id="inkShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102f2a" stop-opacity="1"/>
      <stop offset=".56" stop-color="#102f2a" stop-opacity=".96"/>
      <stop offset=".78" stop-color="#102f2a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#102f2a" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="lowerShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#071a17" stop-opacity="0"/>
      <stop offset="1" stop-color="#071a17" stop-opacity=".82"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0a211d" flood-opacity=".30"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#f3eee2"/>
  <circle cx="1126" cy="35" r="190" fill="#49b9a9" opacity=".12"/>
  <circle cx="55" cy="655" r="175" fill="#c8754d" opacity=".11"/>

  <g filter="url(#shadow)">
    <rect x="45" y="37" width="1110" height="596" rx="28" fill="#102f2a"/>
    <clipPath id="frameClip"><rect x="45" y="37" width="1110" height="596" rx="28"/></clipPath>
    <g clip-path="url(#frameClip)">
      <image x="530" y="37" width="625" height="596" preserveAspectRatio="xMidYMid slice" xlink:href="hero-evidence-dossier-v4.jpg"/>
      <rect x="45" y="37" width="1110" height="596" fill="url(#inkShade)"/>
      <rect x="530" y="37" width="625" height="596" fill="url(#lowerShade)"/>
      <path d="M45 96H1155" stroke="#fffaf0" stroke-opacity=".18"/>
      <path d="M530 96V633" stroke="#fffaf0" stroke-opacity=".18"/>
    </g>
  </g>

  <text x="80" y="76" fill="#9fbbb4" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">APPLIED SUSTAINABILITY · KNOWLEDGE REVIEW</text>
  <circle cx="875" cy="70" r="5" fill="#c8754d"/>
  <text x="1128" y="75" text-anchor="end" fill="#d8e1dc" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">AIRBUS DEFENCE AND SPACE CONTEXT</text>

  <text x="82" y="148" fill="#8dd3c8" font-family="Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2.6">SUSTAINABILITY KNOWLEDGE CHECK</text>
  <text x="78" y="225" fill="#fffaf0" font-family="Arial, sans-serif" font-size="54" font-weight="800">Good decisions need</text>
  <text x="78" y="286" fill="#fffaf0" font-family="Arial, sans-serif" font-size="54" font-weight="800">more than</text>
  <text x="78" y="348" fill="#e4b28f" font-family="Georgia, serif" font-size="60" font-style="italic">good intentions.</text>
  <text x="82" y="401" fill="#becac5" font-family="Arial, sans-serif" font-size="16">18 realistic choices. Examine the evidence, lifecycle</text>
  <text x="82" y="425" fill="#becac5" font-family="Arial, sans-serif" font-size="16">trade-offs and operational constraints—then decide.</text>

  <rect x="82" y="465" width="207" height="53" rx="27" fill="#d8ef62"/>
  <text x="111" y="498" fill="#10211e" font-family="Arial, sans-serif" font-size="14" font-weight="800">BEGIN THE REVIEW  →</text>
  <rect x="304" y="465" width="128" height="53" rx="27" fill="#ffffff" fill-opacity=".06" stroke="#fffaf0" stroke-opacity=".28"/>
  <text x="329" y="498" fill="#fffaf0" font-family="Arial, sans-serif" font-size="13" font-weight="700">HOW IT WORKS</text>

  <path d="M82 555H466" stroke="#fffaf0" stroke-opacity=".2"/>
  <text x="82" y="580" fill="#fffaf0" font-family="Georgia, serif" font-size="18">18</text>
  <text x="110" y="580" fill="#91a39c" font-family="Arial, sans-serif" font-size="10">SCENARIOS</text>
  <text x="215" y="580" fill="#fffaf0" font-family="Georgia, serif" font-size="18">15–20</text>
  <text x="270" y="580" fill="#91a39c" font-family="Arial, sans-serif" font-size="10">MINUTES</text>
  <text x="371" y="580" fill="#fffaf0" font-family="Georgia, serif" font-size="18">6</text>
  <text x="392" y="580" fill="#91a39c" font-family="Arial, sans-serif" font-size="10">AREAS</text>

  <g transform="translate(599 432)">
    <rect width="420" height="130" fill="#fffaf0" fill-opacity=".95"/>
    <rect width="5" height="130" fill="#c8754d"/>
    <text x="26" y="29" fill="#934a2d" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1.8">EVIDENCE DOSSIER</text>
    <text x="26" y="65" fill="#10211e" font-family="Georgia, serif" font-size="25">Review before conclusion</text>
    <text x="26" y="92" fill="#65736d" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">BOUNDARY · FUNCTION · DATA · TRADE-OFF</text>
    <path d="M286 107H389" stroke="#10211e" stroke-opacity=".2"/>
    <circle cx="374" cy="31" r="18" fill="#102f2a"/>
    <text x="374" y="35" text-anchor="middle" fill="#fffaf0" font-family="Arial, sans-serif" font-size="8" font-weight="800">SKC</text>
  </g>

  <g transform="translate(1064 118)">
    <circle r="36" fill="#102f2a" fill-opacity=".84" stroke="#fffaf0" stroke-opacity=".5"/>
    <text y="-5" text-anchor="middle" fill="#fffaf0" font-family="Arial, sans-serif" font-size="8" letter-spacing="1">AREA</text>
    <text y="20" text-anchor="middle" fill="#fffaf0" font-family="Georgia, serif" font-size="25">01</text>
  </g>
</svg>
